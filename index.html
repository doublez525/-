<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>写给 zz 的心动时刻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
      <div class="sparkles" aria-hidden="true"></div>

      <section class="card" id="card">
        <p class="eyebrow">A LITTLE LOVE NOTE</p>
        <div class="heart-mark" aria-hidden="true">♥</div>
        <h1>这份心动，<br /><em>写给 小邓</em></h1>
        <p class="intro">有些名字不必写下，<br />因为早已藏在心里。</p>

        <button type="button" id="reveal-button">点亮爱心 <span>→</span></button>
        <p class="hint">这一刻的爱意，只属于 zz</p>
      </section>

      <section class="love-message" id="love-message" aria-live="polite" aria-hidden="true">
        <p class="eyebrow">FOR ZZ, WITH ALL MY HEART</p>
        <div class="big-heart">♥</div>
        <h2>小邓<br />愿你被爱意包围</h2>
        <p>今天、明天，以及每一个平凡又闪亮的日子。</p>
        <button class="again" id="again-button">再看一次</button>
      </section>

      <div class="heart-field" id="heart-field" aria-hidden="true"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
